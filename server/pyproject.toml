[project]
name = "tilie-server"
version = "0.1.0"
description = "The local server of TimeLineEditor: serves the editor and bridges it to timetoalign."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Johannes Hentschel" }]
keywords = ["music", "timeline", "alignment", "editor", "timetoalign"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53,<1",
  "timetoalign>=1.2.0",
]

[project.urls]
Repository = "https://github.com/timetoalign/TimeLineEditor"

[project.scripts]
tilie = "tilie_server.cli:main"

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilie_server"]
# The built editor is copied in by hatch_build.py and is ignored by git,
# so it has to be declared as an artifact to be packaged.
artifacts = ["src/tilie_server/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/tilie_server/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# The release-age policy of the repository: a package version must be at least
# fourteen days old. Move this date forward when refreshing the lockfile.
exclude-newer = "2026-09-25T00:00:00Z"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
