name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TimeLineEditor/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: TimeLineEditor
      - uses: ./TimeLineEditor/.github/actions/install-app
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: editor-dist
          path: TimeLineEditor/app/packages/editor/dist
          if-no-files-found: error

  e2e:
    name: End-to-end tests in Chromium, Firefox, WebKit and on touch
    runs-on: ubuntu-24.04
    # The image of the locked @playwright/test version; screenshot tests are
    # not run here.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
    defaults:
      run:
        working-directory: TimeLineEditor/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: TimeLineEditor
      - uses: ./TimeLineEditor/.github/actions/install-app
      - run: pnpm e2e:fixtures:check
      - run: pnpm e2e:all
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            TimeLineEditor/app/playwright-report
            TimeLineEditor/app/e2e/test-results
          if-no-files-found: ignore

  tikz:
    name: TikZ figures compile under LuaLaTeX
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TimeLineEditor/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: TimeLineEditor
      # The figures read their fonts from the schema package's files, never a system copy.
      - name: Install a minimal TeX Live with LuaLaTeX, TikZ and standalone
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures
      - uses: ./TimeLineEditor/.github/actions/install-app
      - name: Compile every golden TikZ figure
        run: pnpm vitest run --project writers packages/writers/tests/compile.test.ts
        env:
          TILIE_REQUIRE_LUALATEX: "1"

  server:
    needs: app
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    # server/pyproject.toml takes timetoalign from the checkout beside this
    # repository until a timetoalign release carries the measure-map expansion,
    # and timetoshare (which timetoalign reads links with) from the TimeToShare
    # checkout until a release carries schema 0.2.0, so the three repositories
    # are checked out side by side.
    defaults:
      run:
        working-directory: TimeLineEditor/server
    steps:
      - uses: actions/checkout@v7
        with:
          path: TimeLineEditor
      - uses: actions/checkout@v7
        with:
          repository: TimeToAlign/timetoalign
          # the timetoalign commit server/uv.lock was locked against; moves with it
          ref: a5884e355378e1068f8457eebdae7d96db992936
          path: timetoalign
      - uses: actions/checkout@v7
        with:
          repository: TimeToAlign/TimeToShare
          # main, as the app's install takes it; uv.lock records only the
          # package's version and requirements, which a relock follows
          ref: main
          path: TimeToShare
      - uses: actions/download-artifact@v8
        with:
          name: editor-dist
          path: TimeLineEditor/app/packages/editor/dist
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Install the wheel in a clean environment and run the self-check
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/tilie --check --no-browser
      - name: The wheel bundles the built editor
        run: unzip -l dist/*.whl | grep tilie_server/static/index.html
      - name: The wheel carries no test hook
        run: |
          if unzip -p dist/*.whl | grep -a -q __tilie; then
            echo "the wheel contains the end-to-end test hook (__tilie)" >&2
            exit 1
          fi
