name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: editor-dist
          path: app/packages/editor/dist
          if-no-files-found: error

  tikz:
    name: TikZ figures compile under LuaLaTeX
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install a minimal TeX Live with LuaLaTeX, TikZ, standalone and DejaVu Sans
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures fonts-dejavu-core
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Compile every golden TikZ figure
        run: pnpm vitest run --project writers packages/writers/tests/compile.test.ts
        env:
          TILIE_REQUIRE_LUALATEX: "1"

  server:
    needs: app
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: editor-dist
          path: app/packages/editor/dist
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Install the wheel in a clean environment and run the self-check
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/tilie --check --no-browser
      - name: The wheel bundles the built editor
        run: unzip -l dist/*.whl | grep tilie_server/static/index.html
