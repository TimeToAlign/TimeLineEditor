# release-please keeps one release pull request open, carrying the next version (in
# server/pyproject.toml, app/package.json and server/uv.lock) and its changelog entry.
# Merging it tags vX.Y.Z and creates the GitHub release; the build job then checks the
# tag against the declared versions, tests and builds the app and the server, and the
# publish job uploads the wheel and sdist to PyPI through trusted publishing (OIDC):
# no token is stored. The docs job then dispatches docs.yml with the tag, which
# publishes the release's folder of the documentation site.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          path: TimeLineEditor
      - uses: actions/checkout@v7
        with:
          repository: TimeToAlign/timetoalign
          # the timetoalign commit server/uv.lock was locked against; ci.yml,
          # release.yml and docs.yml name the same commit
          ref: a4a3d1977450b459a6f4c2d8603cbb2b151711f0
          path: timetoalign
      - name: The tag matches the declared versions
        run: python3 TimeLineEditor/scripts/check_versions.py --tag "${{ needs.release-please.outputs.tag_name }}"
      - uses: ./TimeLineEditor/.github/actions/install-app
      - run: pnpm lint && pnpm typecheck && pnpm test
        working-directory: TimeLineEditor/app
      - run: pnpm build
        working-directory: TimeLineEditor/app
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.11"
      - run: uv sync --locked
        working-directory: TimeLineEditor/server
      - run: uv run pytest
        working-directory: TimeLineEditor/server
      - run: uv build
        working-directory: TimeLineEditor/server
      - name: The wheel bundles the built editor
        run: unzip -l TimeLineEditor/server/dist/*.whl | grep tilie_server/static/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: TimeLineEditor/server/dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # A tag pushed with the workflow token starts no workflow, so the
      # documentation of the release is published by dispatching docs.yml.
      - name: Publish the documentation of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
