packages:
  - "packages/*"

# A published version must be at least 14 days old before pnpm installs it
# (minutes). Manifests declare compatible ranges for runtime and peer
# dependencies, and pnpm-lock.yaml pins every resolved version; together with
# this window that is the dependency policy of the repository. Renovate
# applies the same window.
minimumReleaseAge: 20160

# The TimeSkeleton schema is published from the sibling repository of this
# project and consumed as soon as it is released; it is the one exception to
# the release-age window (decisions/0012).
minimumReleaseAgeExclude:
  - "@timetoalign/timeskeleton"
